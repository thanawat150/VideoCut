name: AutoCut Studio Windows CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 85

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Download pinned Whisper.cpp and multilingual model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "v1.8.6"
          $toolDownload = Join-Path $PWD ".tools\whisper-download"
          $toolDirectory = Join-Path $PWD ".tools\whisper"
          $modelDirectory = Join-Path $PWD ".tools\whisper-model"
          New-Item $toolDownload -ItemType Directory -Force | Out-Null
          New-Item $toolDirectory -ItemType Directory -Force | Out-Null
          New-Item $modelDirectory -ItemType Directory -Force | Out-Null

          $archive = Join-Path $env:RUNNER_TEMP "whisper-bin-x64.zip"
          curl.exe -L --fail --retry 3 --retry-delay 2 `
            "https://github.com/ggml-org/whisper.cpp/releases/download/$version/whisper-bin-x64.zip" `
            -o $archive
          Expand-Archive $archive $toolDownload -Force
          $cli = Get-ChildItem $toolDownload -Filter "whisper-cli.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $cli) { throw "Official whisper.cpp archive did not contain whisper-cli.exe." }
          Copy-Item (Join-Path $cli.Directory.FullName "*") $toolDirectory -Recurse -Force

          $model = Join-Path $modelDirectory "ggml-base-q5_1.bin"
          curl.exe -L --fail --retry 3 --retry-delay 2 `
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true" `
            -o $model
          if (-not (Test-Path $model -PathType Leaf) -or (Get-Item $model).Length -lt 50MB) {
            throw "Whisper multilingual model is missing or incomplete."
          }
          curl.exe -L --fail --retry 3 `
            "https://raw.githubusercontent.com/ggml-org/whisper.cpp/$version/LICENSE" `
            -o (Join-Path $toolDirectory "LICENSE-whisper.cpp.txt")

          $whisperCli = Join-Path $toolDirectory "whisper-cli.exe"
          & $whisperCli -h
          if ($LASTEXITCODE -ne 0) { throw "Downloaded whisper-cli.exe failed to start." }
          "AUTOCUT_WHISPER_CLI_PATH=$whisperCli" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOCUT_WHISPER_MODEL_PATH=$model" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOCUT_BUNDLE_WHISPER_DIR=$toolDirectory" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOCUT_BUNDLE_WHISPER_MODEL=$model" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download official OpenCV Zoo models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directory = Join-Path $PWD ".tools\vision-models"
          New-Item $directory -ItemType Directory -Force | Out-Null
          $face = Join-Path $directory "face_detection_yunet_2023mar.onnx"
          $object = Join-Path $directory "object_detection_yolox_2022nov.onnx"
          curl.exe -L --fail --retry 3 --retry-delay 2 `
            "https://media.githubusercontent.com/media/opencv/opencv_zoo/refs/heads/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" `
            -o $face
          curl.exe -L --fail --retry 3 --retry-delay 2 `
            "https://media.githubusercontent.com/media/opencv/opencv_zoo/refs/heads/main/models/object_detection_yolox/object_detection_yolox_2022nov.onnx" `
            -o $object
          curl.exe -L --fail --retry 3 `
            "https://raw.githubusercontent.com/opencv/opencv_zoo/main/LICENSE" `
            -o (Join-Path $directory "LICENSE-opencv-zoo.txt")
          if (-not (Test-Path $face -PathType Leaf) -or (Get-Item $face).Length -lt 200KB) {
            throw "YuNet model is missing or incomplete."
          }
          if (-not (Test-Path $object -PathType Leaf) -or (Get-Item $object).Length -lt 20MB) {
            throw "YOLOX model is missing or incomplete."
          }
          "AUTOCUT_FACE_MODEL_PATH=$face" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOCUT_OBJECT_MODEL_PATH=$object" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOCUT_BUNDLE_FACE_MODEL=$face" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUTOCUT_BUNDLE_OBJECT_MODEL=$object" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show tools and models
        shell: pwsh
        run: |
          dotnet --info
          ffmpeg -version
          ffprobe -version
          & $env:AUTOCUT_WHISPER_CLI_PATH -h
          Get-Item $env:AUTOCUT_WHISPER_MODEL_PATH,$env:AUTOCUT_FACE_MODEL_PATH,$env:AUTOCUT_OBJECT_MODEL_PATH |
            Format-Table FullName,Length

      - name: Restore
        run: dotnet restore AutoCutStudio.sln

      - name: Build
        run: dotnet build AutoCutStudio.sln -c Release --no-restore

      - name: Test with real media, Whisper and OpenCV models
        run: dotnet test AutoCutStudio.sln -c Release --no-build --logger "trx;LogFileName=autocut-tests.trx"

      - name: Verify asInvoker manifest
        shell: pwsh
        run: |
          $manifest = Get-Content "src/AutoCutStudio.App/app.manifest" -Raw
          if ($manifest -notmatch 'requestedExecutionLevel level="asInvoker"') {
            throw "Application manifest is not asInvoker."
          }

      - name: Build portable artifact with FFmpeg Whisper and vision models
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Verify portable ZIP and bundled dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Resolve-Path "artifacts/AutoCutStudio-win-x64.zip"
          $verifyRoot = Join-Path $env:RUNNER_TEMP "autocut-portable-verify"
          Remove-Item $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip $verifyRoot -Force

          $app = Join-Path $verifyRoot "AutoCutStudio.exe"
          $worker = Join-Path $verifyRoot "AutoCutStudio.Worker.exe"
          $ffmpeg = Join-Path $verifyRoot "tools\ffmpeg\ffmpeg.exe"
          $ffprobe = Join-Path $verifyRoot "tools\ffmpeg\ffprobe.exe"
          $whisper = Join-Path $verifyRoot "tools\whisper\whisper-cli.exe"
          $whisperModel = Join-Path $verifyRoot "models\whisper\ggml-base-q5_1.bin"
          $faceModel = Join-Path $verifyRoot "models\opencv\face_detection_yunet_2023mar.onnx"
          $objectModel = Join-Path $verifyRoot "models\opencv\object_detection_yolox_2022nov.onnx"
          $ffmpegManifest = Join-Path $verifyRoot "third_party\ffmpeg\bundle-manifest.json"
          $whisperManifest = Join-Path $verifyRoot "third_party\whisper.cpp\bundle-manifest.json"
          $visionManifest = Join-Path $verifyRoot "third_party\opencv-zoo\bundle-manifest.json"

          foreach ($required in @(
            $app, $worker, $ffmpeg, $ffprobe, $whisper, $whisperModel,
            $faceModel, $objectModel, $ffmpegManifest, $whisperManifest, $visionManifest
          )) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Required portable file is missing: $required" }
          }
          if ((Get-Item $whisperModel).Length -lt 50MB) { throw "Bundled Whisper model is unexpectedly small." }
          if ((Get-Item $faceModel).Length -lt 200KB) { throw "Bundled YuNet model is unexpectedly small." }
          if ((Get-Item $objectModel).Length -lt 20MB) { throw "Bundled YOLOX model is unexpectedly small." }

          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg.exe failed to start." }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe.exe failed to start." }
          & $whisper -h
          if ($LASTEXITCODE -ne 0) { throw "Bundled whisper-cli.exe failed to start." }

          $doctorOutput = & $worker --doctor
          if ($LASTEXITCODE -ne 0) { throw "Portable worker dependency doctor failed: $doctorOutput" }
          $doctor = $doctorOutput | ConvertFrom-Json
          if (-not $doctor.ready -or $doctor.status -ne "ready") {
            throw "Portable ToolLocator did not detect bundled FFmpeg: $doctorOutput"
          }
          if (-not $doctor.face_model_ready -or -not $doctor.object_model_ready) {
            throw "Portable worker did not detect bundled vision models: $doctorOutput"
          }

          $testDirectory = Join-Path $verifyRoot "ทดสอบ path มีช่องว่าง"
          New-Item $testDirectory -ItemType Directory -Force | Out-Null
          $testMedia = Join-Path $testDirectory "portable input.mp4"
          & $ffmpeg -hide_banner -loglevel error -y `
            -f lavfi -i "testsrc2=size=320x180:rate=25" `
            -f lavfi -i "sine=frequency=440:sample_rate=48000" `
            -t 1.5 -c:v libx264 -pix_fmt yuv420p -c:a aac $testMedia
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $testMedia -PathType Leaf)) {
            throw "Bundled FFmpeg could not create real test media."
          }
          $probeJson = & $ffprobe -v error -show_entries stream=codec_type -of json $testMedia
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe could not inspect test media." }
          $probe = $probeJson | ConvertFrom-Json
          $types = @($probe.streams | ForEach-Object { $_.codec_type })
          if ($types -notcontains "video" -or $types -notcontains "audio") {
            throw "Portable test media is missing a video or audio stream."
          }

          $speechWav = Join-Path $testDirectory "generated local speech.wav"
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $voice.SetOutputToWaveFile($speechWav)
            $voice.Speak("Hello. This is the Auto Cut Studio local transcription smoke test.")
          }
          finally { $voice.Dispose() }
          if (-not (Test-Path $speechWav -PathType Leaf)) { throw "Windows SAPI did not create speech test media." }

          $transcriptBase = Join-Path $testDirectory "portable transcript"
          Push-Location $testDirectory
          try {
            & $whisper -m $whisperModel -f "generated local speech.wav" -l en -t 2 -ng `
              -ojf -osrt -otxt -of "portable transcript"
            $whisperExit = $LASTEXITCODE
          }
          finally { Pop-Location }
          if ($whisperExit -ne 0) { throw "Bundled Whisper transcription smoke test failed." }
          foreach ($output in @("$transcriptBase.json", "$transcriptBase.srt", "$transcriptBase.txt")) {
            if (-not (Test-Path $output -PathType Leaf) -or (Get-Item $output).Length -eq 0) {
              throw "Bundled Whisper did not create a valid output: $output"
            }
          }

          $zipTest = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($entry in $zipTest.Entries) {
              $stream = $entry.Open()
              try {
                $buffer = New-Object byte[] 81920
                while ($stream.Read($buffer, 0, $buffer.Length) -gt 0) { }
              }
              finally { $stream.Dispose() }
            }
          }
          finally { $zipTest.Dispose() }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-win-x64-phase5
          path: |
            artifacts/AutoCutStudio-win-x64.zip
            artifacts/AutoCutStudio-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocut-test-results
          path: |
            **/TestResults/*.trx
          if-no-files-found: warn
