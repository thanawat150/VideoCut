name: AutoCut Studio Drive Parts PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/package-drive-parts-pr.yml
      - scripts/split-drive-package.ps1

permissions:
  actions: read
  contents: read

jobs:
  split-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Local AI portable artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path source -Force | Out-Null
          gh run download 30617144463 `
            --repo thanawat150/VideoCut `
            --name AutoCutStudio-win-x64-final `
            --dir source
          $portable = Get-ChildItem source -Filter "AutoCutStudio-win-x64.zip" -File -Recurse | Select-Object -First 1
          if ($null -eq $portable) { throw "Validated portable ZIP was not found." }
          Copy-Item $portable.FullName "AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip" -Force

      - name: Split and verify package
        shell: pwsh
        run: |
          ./scripts/split-drive-package.ps1 `
            -SourceZip ./AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip `
            -OutputDirectory ./drive-parts

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-LocalAI-part-00
          path: drive-parts/AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip.00.part
          compression-level: 0
          retention-days: 30

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-LocalAI-part-01
          path: drive-parts/AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip.01.part
          compression-level: 0
          retention-days: 30

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-LocalAI-part-02
          path: drive-parts/AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip.02.part
          compression-level: 0
          retention-days: 30

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-LocalAI-part-03
          path: drive-parts/AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip.03.part
          compression-level: 0
          retention-days: 30

      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-LocalAI-part-04
          path: drive-parts/AutoCutStudio-Local-AI-ComfyUI-Piper-win-x64.zip.04.part
          compression-level: 0
          retention-days: 30

      - name: Upload join tools
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-LocalAI-join-tools
          path: |
            drive-parts/Join-AutoCutStudio.ps1
            drive-parts/README.txt
            drive-parts/SHA256.txt
            drive-parts/SHA256-parts.txt
          retention-days: 30
